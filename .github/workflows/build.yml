# Build verification CI
#
# Runs on every push to main and on pull requests to catch build
# regressions across all chip targets before release.

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout distribution validation tools
        uses: actions/checkout@v6
        with:
          repository: Serin-Labs/serin-cn105
          ref: main
          path: validation-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install release test dependencies
        run: |
          python3 -m pip install -r validation-tools/scripts/requirements-validation.txt \
            -r test/release_workflow/requirements.txt

      - name: Run host tests
        env:
          SERIN_DISTRIBUTION_ROOT: ${{ github.workspace }}/validation-tools
        run: |
          for t in test/*/run.sh; do
            echo "=== $t ==="
            bash "$t"
          done

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Published boards only. The esp32c3-mini and esp32-devkit profiles
        # still build from source (see sdkconfig.defaults.esp32c3 / .esp32) but
        # are no longer released, so they are not verified here either.
        include:
          - target: esp32c6
            name: nanoc6
            profile_flag: -DBOARD_PROFILE_NANOC6=1
          - target: esp32s3
            name: m5atoms3-lite
            profile_flag: -DBOARD_PROFILE_M5ATOMS3_LITE=1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build (${{ matrix.name }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          # Exact patch, not the v5.5 branch tip. 5.5.4 is what
          # dependencies.lock records and what the bench units run, and the
          # NimBLE security-manager overrides in sdkconfig.defaults exist
          # specifically because 5.5.4 changed how ble_sm compiles out — this
          # is a real axis of variation, so pin it.
          esp_idf_version: v5.5.4
          target: ${{ matrix.target }}
          command: |
            idf.py set-target ${{ matrix.target }}
            idf.py ${{ matrix.profile_flag }} build
            idf.py size

      - name: Report binary size
        run: |
          SIZE=$(stat -c%s build/mitsubishi-cn105-homekit.bin)
          HUMAN=$(numfmt --to=iec-i --suffix=B "$SIZE")
          echo "### ${{ matrix.name }} (${{ matrix.target }}): ${HUMAN}" >> "$GITHUB_STEP_SUMMARY"
