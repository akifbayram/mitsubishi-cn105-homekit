# Firmware Release CI/CD (ESP-IDF)
#
# Builds firmware for all chip targets using ESP-IDF and deploys to the
# serin-cn105 distribution repo for ESP Web Tools flashing.
#
# Publisher credentials:
#   SERIN_PUBLISHER_CLIENT_ID — repository variable for the publishing App
#   SERIN_PUBLISHER_PRIVATE_KEY — repository secret containing its PEM key
# The deployment job requests a token for Serin-Labs/serin-cn105 only.

name: Firmware Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # esp32-devkit and esp32c3-mini were published through v0.2.4 and are
        # not any more: their images carried an 8 MB flash header while the
        # boards ship with 4 MB, so the bootloader refused them. Both still
        # build from source. Publish again only once one is confirmed on real
        # hardware — and put the flash-size defaults under test when you do.
        include:
          - target: esp32c6
            name: nanoc6
            chip: ESP32-C6
          - target: esp32s3
            name: m5atoms3-lite
            chip: ESP32-S3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # Hand the pushed tag to the build so the baked version and the manifest the
      # deploy job publishes below both come from github.ref_name. Why that matters
      # rather than letting the build re-derive its own: project_ver.py's main().
      #
      # It is handed over as a file because the build runs inside
      # espressif/esp-idf-ci-action's container, and that action's docker run
      # forwards exactly one variable, -e IDF_TARGET — so no step-level env: can
      # reach the build command. GITHUB_WORKSPACE is bind-mounted, so a file can.
      # Written from env: and read back with $(cat) inside the container, the tag
      # is never interpolated into a shell command by Actions.
      - name: Record the pushed tag for the build
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: printf '%s' "${REF_NAME}" > .release-tag

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          # Pinned to the exact patch the release was tested against — see the
          # same note in build.yml.
          esp_idf_version: v5.5.4
          target: ${{ matrix.target }}
          command: bash scripts/build-release.sh "${{ matrix.target }}" "${{ matrix.name }}"

      - name: Check release image version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-image.py build/mitsubishi-cn105-homekit.bin "$RELEASE_TAG"

      - name: Collect artifacts
        env:
          BUILD_NAME: ${{ matrix.name }}
        run: |
          mkdir -p artifact/"${BUILD_NAME}"
          cp build/bootloader/bootloader.bin artifact/"${BUILD_NAME}"/bootloader.bin
          cp build/partition_table/partition-table.bin artifact/"${BUILD_NAME}"/partitions.bin
          cp build/ota_data_initial.bin artifact/"${BUILD_NAME}"/boot_app0.bin
          cp build/mitsubishi-cn105-homekit.bin artifact/"${BUILD_NAME}"/firmware.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}
          path: artifact/${{ matrix.name }}/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Manual branch runs build artifacts without replacing published firmware.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts/

      - name: Extract version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            VERSION="${REF_NAME}"
          else
            VERSION="v0.0.0-dev"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

          # A hyphen in the tag is what makes it a prerelease: v0.2.6-beta.1.
          # Betas publish into firmware/homekit/beta/ and never touch stable,
          # so the web installer keeps serving the stable manifest.
          if [[ "${VERSION}" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "dir=firmware/homekit/beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "dir=firmware/homekit" >> "$GITHUB_OUTPUT"
          fi

      - name: Create distribution token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SERIN_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.SERIN_PUBLISHER_PRIVATE_KEY }}
          owner: Serin-Labs
          repositories: serin-cn105
          permission-contents: write

      - name: Checkout serin-cn105
        uses: actions/checkout@v6
        with:
          repository: Serin-Labs/serin-cn105
          token: ${{ steps.publisher-token.outputs.token }}
          path: serin-cn105
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install distribution validation tools
        run: python3 -m pip install -r serin-cn105/scripts/requirements-validation.txt

      - name: Deploy firmware files
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          CHANNEL_DIR: ${{ steps.version.outputs.dir }}
        run: |
          cd serin-cn105

          if [ "${CHANNEL}" = "beta" ]; then
            # Beta owns only its own directory: one prerelease is kept at a
            # time, and stable is never touched by a beta tag.
            rm -rf "${CHANNEL_DIR}"
            mkdir -p "${CHANNEL_DIR}"
          else
            # Named board directories, NOT a glob. Two reasons: this is what
            # unpublishes the broken 8 MB-header esp32-devkit and esp32c3-mini
            # binaries v0.2.4 left behind (they are no longer built — see the
            # matrix above), and a glob here would delete firmware/homekit/beta
            # along with them, silently unpublishing the beta channel on every
            # stable release.
            rm -rf firmware/homekit/nanoc6 \
                   firmware/homekit/m5atoms3-lite \
                   firmware/homekit/esp32-devkit \
                   firmware/homekit/esp32c3-mini

            # Remove legacy single merged bins if they exist. A file glob, so
            # it cannot match the beta directory either.
            rm -f firmware/homekit/*.bin
          fi

          # Copy new firmware files
          for name in nanoc6 m5atoms3-lite; do
            mkdir -p "${CHANNEL_DIR}/${name}"
            cp ../artifacts/firmware-${name}/* "${CHANNEL_DIR}/${name}/"
          done

      - name: Generate manifest.json
        env:
          VERSION: ${{ steps.version.outputs.number }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          CHANNEL_DIR: ${{ steps.version.outputs.dir }}
        run: |
          sha() { sha256sum "artifacts/firmware-$1/$2" | cut -d' ' -f1; }
          SHA_NANOC6=$(sha nanoc6 firmware.bin)
          SHA_M5ATOMS3=$(sha m5atoms3-lite firmware.bin)

          # parts[].path stays relative: it resolves against the manifest's own
          # directory in both consumers (the device's update check and the web
          # installer), so the same shape works on either channel.
          # "channel" is informational — each consumer knows which channel it is
          # on from the URL it fetched, and nothing branches on this key.
          cat > "serin-cn105/${CHANNEL_DIR}/manifest.json" << EOF
          {
            "name": "Mitsubishi HomeKit Controller",
            "version": "${VERSION}",
            "channel": "${CHANNEL}",
            "release_url": "https://github.com/akifbayram/mitsubishi-cn105-homekit/releases/tag/${TAG}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-C6",
                "board": "nanoc6",
                "sha256": "${SHA_NANOC6}",
                "parts": [
                  { "path": "nanoc6/bootloader.bin", "offset": 0, "sha256": "$(sha nanoc6 bootloader.bin)" },
                  { "path": "nanoc6/partitions.bin", "offset": 32768, "sha256": "$(sha nanoc6 partitions.bin)" },
                  { "path": "nanoc6/boot_app0.bin", "offset": 57344, "sha256": "$(sha nanoc6 boot_app0.bin)" },
                  { "path": "nanoc6/firmware.bin", "offset": 65536, "sha256": "$(sha nanoc6 firmware.bin)" }
                ]
              },
              {
                "chipFamily": "ESP32-S3",
                "board": "m5atoms3-lite",
                "sha256": "${SHA_M5ATOMS3}",
                "parts": [
                  { "path": "m5atoms3-lite/bootloader.bin", "offset": 0, "sha256": "$(sha m5atoms3-lite bootloader.bin)" },
                  { "path": "m5atoms3-lite/partitions.bin", "offset": 32768, "sha256": "$(sha m5atoms3-lite partitions.bin)" },
                  { "path": "m5atoms3-lite/boot_app0.bin", "offset": 57344, "sha256": "$(sha m5atoms3-lite boot_app0.bin)" },
                  { "path": "m5atoms3-lite/firmware.bin", "offset": 65536, "sha256": "$(sha m5atoms3-lite firmware.bin)" }
                ]
              }
            ]
          }
          EOF

          python3 -m json.tool "serin-cn105/${CHANNEL_DIR}/manifest.json" > /dev/null
          echo "manifest OK (${CHANNEL})"

      # Consumers read main directly, so validation must finish before the push.
      - name: Validate distribution manifests
        run: python3 serin-cn105/scripts/validate-manifests.py

      - name: Commit and push to serin-cn105
        env:
          VERSION: ${{ steps.version.outputs.number }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          set -euo pipefail
          cd serin-cn105
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Covers both channels: beta/ lives under firmware/homekit/.
          git add firmware/homekit/
          if git diff --cached --quiet; then
            echo "Distribution already contains this release."
            exit 0
          fi
          git commit -m "chore: update homekit ${CHANNEL} firmware to ${VERSION}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              git pull --rebase origin main
              # Another publisher may have changed any product during the build.
              # Recheck the entire candidate tree before the next push.
              python3 scripts/validate-manifests.py
            fi
          done
          echo "Distribution push failed after three attempts." >&2
          exit 1

  release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release
          for name in nanoc6 m5atoms3-lite; do
            cp artifacts/firmware-${name}/firmware.bin release/firmware-${name}.bin
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # Publication waits for validated distribution deployment above.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/firmware-*.bin
