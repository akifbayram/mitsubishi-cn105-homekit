## Managed-component bounds.
##
## Pins direct and transitive dependencies so that all multi-target release
## builds resolve the exact tested versions without needing a committed
## target-specific lockfile (which would make multi-target builds dirty).
##
## Versions below are the ones this release was built and bench-tested against.
dependencies:
  espressif/led_strip: "~3.0.3"
  espressif/mdns: "~1.11.3"
  espressif/libsodium: "~1.0.22"
  espressif/json_parser: "~1.0.3"
  espressif/json_generator: "~1.1.2"
  espressif/jsmn: "~1.1.0"
